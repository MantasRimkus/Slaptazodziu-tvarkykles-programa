<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<title>Slaptažodžių tvarkyklė</title>
<style>
body { font-family: Arial; background:#f2f2f2; padding:30px; }
.container { max-width:900px; margin:auto; background:white; padding:20px; border-radius:10px; box-shadow:0 0 10px #aaa; }
input, textarea, button { padding:10px; margin:5px; }
input, textarea { width:95%; }
button { cursor:pointer; }
.card { border:1px solid #ccc; padding:10px; margin:10px 0; border-radius:8px; }
.hidden { display:none; }
</style>
</head>
<body>

<div class="container">
<h2>Slaptažodžių tvarkyklė</h2>

<h3>Pagrindinis slaptažodis</h3>
<input id="masterPassword" type="password" placeholder="Įvesk pagrindinį slaptažodį">
<button onclick="unlockVault()">Prisijungti / iššifruoti</button>
<button onclick="lockVault()">Užšifruoti / atsijungti</button>

<hr>

<div id="app" class="hidden">

<h3>Naujas įrašas</h3>
<input id="title" placeholder="Pavadinimas">
<input id="password" placeholder="Slaptažodis">
<input id="url" placeholder="URL arba programa">
<textarea id="notes" placeholder="Pastabos"></textarea>

<button onclick="addEntry()">Pridėti</button>
<button onclick="generatePassword()">Generuoti slaptažodį</button>

<hr>

<h3>Paieška</h3>
<input id="search" placeholder="Ieškoti pagal pavadinimą" oninput="renderEntries()">

<hr>

<h3>Įrašai</h3>
<div id="entries"></div>

<hr>

<button onclick="exportFile()">Eksportuoti į .txt</button>
<input type="file" accept=".txt" onchange="importFile(event)">

</div>
</div>

<script>
let entries = [];
let cryptoKey = null;

async function getKey(password, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
        "raw",
        enc.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
    );

    return crypto.subtle.deriveKey(
        {
            name: "PBKDF2",
            salt: salt,
            iterations: 100000,
            hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
    );
}

function arrayToBase64(buffer) {
    return btoa(String.fromCharCode(...new Uint8Array(buffer)));
}

function base64ToArray(base64) {
    return Uint8Array.from(atob(base64), c => c.charCodeAt(0));
}

async function encryptText(text) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const enc = new TextEncoder();

    const encrypted = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        cryptoKey,
        enc.encode(text)
    );

    return {
        iv: arrayToBase64(iv),
        data: arrayToBase64(encrypted)
    };
}

async function decryptText(encryptedObject) {
    const iv = base64ToArray(encryptedObject.iv);
    const data = base64ToArray(encryptedObject.data);

    const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        cryptoKey,
        data
    );

    return new TextDecoder().decode(decrypted);
}

async function unlockVault() {
    const password = document.getElementById("masterPassword").value;

    if (!password) {
        alert("Įvesk pagrindinį slaptažodį");
        return;
    }

    let salt = localStorage.getItem("salt");

    if (!salt) {
        const newSalt = crypto.getRandomValues(new Uint8Array(16));
        salt = arrayToBase64(newSalt);
        localStorage.setItem("salt", salt);
    }

    cryptoKey = await getKey(password, base64ToArray(salt));

    const vault = localStorage.getItem("vault");

    if (vault) {
        try {
            const decrypted = await decryptText(JSON.parse(vault));
            entries = JSON.parse(decrypted);
        } catch {
            alert("Neteisingas pagrindinis slaptažodis arba sugadintas failas");
            return;
        }
    } else {
        entries = [];
    }

    document.getElementById("app").classList.remove("hidden");
    renderEntries();
}

async function lockVault() {
    if (!cryptoKey) return;

    const encrypted = await encryptText(JSON.stringify(entries));
    localStorage.setItem("vault", JSON.stringify(encrypted));

    entries = [];
    cryptoKey = null;

    document.getElementById("app").classList.add("hidden");
    alert("Duomenys užšifruoti");
}

async function addEntry() {
    const title = document.getElementById("title").value.trim();
    const password = document.getElementById("password").value;
    const url = document.getElementById("url").value.trim();
    const notes = document.getElementById("notes").value.trim();

    if (!title || !password) {
        alert("Pavadinimas ir slaptažodis būtini");
        return;
    }

    const encryptedPassword = await encryptText(password);

    entries.push({
        title,
        password: encryptedPassword,
        url,
        notes
    });

    clearForm();
    renderEntries();
    await lockAndUnlockAgain();
}

async function updateEntry(index) {
    const newPassword = prompt("Įvesk naują slaptažodį:");

    if (!newPassword) return;

    entries[index].password = await encryptText(newPassword);
    renderEntries();
    await lockAndUnlockAgain();
}

function deleteEntry(index) {
    if (confirm("Ar tikrai ištrinti įrašą?")) {
        entries.splice(index, 1);
        renderEntries();
        lockAndUnlockAgain();
    }
}

async function showPassword(index) {
    const pass = await decryptText(entries[index].password);
    alert("Slaptažodis: " + pass);
}

async function copyPassword(index) {
    const pass = await decryptText(entries[index].password);
    navigator.clipboard.writeText(pass);
    alert("Slaptažodis nukopijuotas");
}

function renderEntries() {
    const container = document.getElementById("entries");
    const search = document.getElementById("search").value.toLowerCase();

    container.innerHTML = "";

    entries.forEach((entry, index) => {
        if (!entry.title.toLowerCase().includes(search)) return;

        container.innerHTML += `
            <div class="card">
                <b>${entry.title}</b><br>
                URL / programa: ${entry.url || "-"}<br>
                Pastabos: ${entry.notes || "-"}<br><br>
                <button onclick="showPassword(${index})">Rodyti slaptažodį</button>
                <button onclick="copyPassword(${index})">Kopijuoti</button>
                <button onclick="updateEntry(${index})">Atnaujinti</button>
                <button onclick="deleteEntry(${index})">Ištrinti</button>
            </div>
        `;
    });
}

function generatePassword() {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
    let pass = "";

    for (let i = 0; i < 16; i++) {
        pass += chars.charAt(Math.floor(Math.random() * chars.length));
    }

    document.getElementById("password").value = pass;
}

function clearForm() {
    document.getElementById("title").value = "";
    document.getElementById("password").value = "";
    document.getElementById("url").value = "";
    document.getElementById("notes").value = "";
}

async function lockAndUnlockAgain() {
    if (!cryptoKey) return;
    const encrypted = await encryptText(JSON.stringify(entries));
    localStorage.setItem("vault", JSON.stringify(encrypted));
}

function exportFile() {
    const vault = localStorage.getItem("vault");
    const salt = localStorage.getItem("salt");

    if (!vault || !salt) {
        alert("Nėra duomenų eksportui");
        return;
    }

    const fileData = JSON.stringify({
        salt: salt,
        vault: JSON.parse(vault)
    });

    const blob = new Blob([fileData], { type: "text/plain" });
    const a = document.createElement("a");

    a.href = URL.createObjectURL(blob);
    a.download = "passwords.txt";
    a.click();
}

function importFile(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            localStorage.setItem("salt", data.salt);
            localStorage.setItem("vault", JSON.stringify(data.vault));
            alert("Failas įkeltas. Dabar įvesk pagrindinį slaptažodį ir spausk Prisijungti.");
        } catch {
            alert("Netinkamas failas");
        }
    };

    reader.readAsText(file);
}

window.addEventListener("beforeunload", async function () {
    if (cryptoKey) {
        const encrypted = await encryptText(JSON.stringify(entries));
        localStorage.setItem("vault", JSON.stringify(encrypted));
    }
});
</script>

</body>
</html>
